<!DOCTYPE html>
<html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Essensplan">
<meta name="theme-color" content="#EEF2EC">
<title>Essensplan</title>
<style>
:root{--bg:#EEF2EC;--ink:#1D2B22;--mut:#5E6F64;--card:#fff;--ac:#0F6B5C;--p:#B8740F;--bad:#B3402F;--line:#D5DDD3}
@media(prefers-color-scheme:dark){:root{--bg:#141C17;--ink:#E6EEE8;--mut:#93A59A;--card:#1E2822;--ac:#4DBBA5;--p:#E0A84A;--bad:#E27D6C;--line:#2E3B33}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 "Avenir Next",ui-rounded,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(70px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:12px 16px}
.v{display:none}.v.on{display:block}
h2{font-size:15px;margin:0 0 4px;font-weight:600}
.mut{color:var(--mut)}.sm{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.pro{font-size:40px;font-weight:700;line-height:1;color:var(--p)}
.pro small{font-size:15px;font-weight:500;color:var(--mut)}
.bar{position:relative;height:10px;border-radius:5px;background:var(--line);margin:10px 0 6px;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;left:0;background:var(--p)}
.bar b{position:absolute;top:0;bottom:0;border-left:2px solid var(--ink);border-right:2px solid var(--ink);opacity:.45}
.meal{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.sl{display:block;font-size:13px;color:var(--mut)}
.meal a{color:var(--ink);font-weight:600;text-decoration:none}
button{font:inherit;color:inherit}
.rr{min-width:44px;min-height:44px;border:1px solid var(--line);background:none;border-radius:10px;font-size:18px}
.pri{width:100%;min-height:48px;border:0;border-radius:12px;background:var(--ac);color:var(--bg);font-weight:600}
.pri:disabled{opacity:.5}
.over{color:var(--bad);font-weight:600}
.note{background:var(--card);border-left:4px solid var(--p);padding:8px 12px;border-radius:6px;font-size:14px}
input[type=text],input[type=password],input[type=number]{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
label.f{display:block;margin:12px 0 4px;font-size:14px;color:var(--mut)}
.row{display:flex;gap:8px}.row button{min-width:90px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 6px 6px 12px;margin:4px 4px 0 0}
.chip button{border:0;background:none;min-width:32px;min-height:32px;font-size:18px}
.it{display:flex;gap:12px;align-items:center;min-height:48px;border-bottom:1px solid var(--line)}
.it input{width:22px;height:22px;accent-color:var(--ac)}
.it.d{opacity:.5;text-decoration:line-through}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-height:56px;border:0;background:none;color:var(--mut);font-size:13px}
nav button.on{color:var(--ac);font-weight:700}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style></head><body><main>
<div id="v-plan" class="v on"></div><div id="v-pan" class="v"></div><div id="v-shop" class="v"></div><div id="v-set" class="v"></div>
</main>
<nav><button data-t="plan" class="on">Plan</button><button data-t="pan">Vorrat</button><button data-t="shop">Einkauf</button><button data-t="set">Einstellungen</button></nav>
<script>
const $=s=>document.querySelector(s),K='essensplan.v1';
const def={key:'',kcal:2500,carb:300,pmin:150,pmax:180,excl:'onion,garlic',pork:'pork,bacon,ham,prosciutto,pancetta,salami,chorizo,lard',pantry:[],plan:null,pools:null,checked:{}};
let S;try{S={...def,...JSON.parse(localStorage.getItem(K)||'{}')}}catch(e){S={...def}}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DE={eier:'eggs',ei:'eggs',milch:'milk',quark:'quark',magerquark:'quark',skyr:'skyr',joghurt:'yogurt',haferflocken:'oats',reis:'rice',kartoffeln:'potato',tomaten:'tomato',spinat:'spinach',linsen:'lentils',kichererbsen:'chickpeas',tofu:'tofu',käse:'cheese',hähnchen:'chicken',lachs:'salmon',thunfisch:'tuna',brokkoli:'broccoli',paprika:'bell pepper',karotten:'carrot',zucchini:'zucchini',avocado:'avocado',nüsse:'nuts',butter:'butter',olivenöl:'olive oil',feta:'feta',mozzarella:'mozzarella',bohnen:'beans',nudeln:'pasta',gurke:'cucumber',pilze:'mushroom',champignons:'mushroom',blumenkohl:'cauliflower',erdnussbutter:'peanut butter',mandeln:'almonds'};
const en=w=>{w=w.trim().toLowerCase();return DE[w]||w};
const has=n=>S.pantry.some(p=>n.includes(p)||(n.length>=3&&p.includes(n)));
const SKIP=/^(salt|water|pepper|black pepper|ice|ice cubes|sea salt|kosher salt)$/;
const SL=['Frühstück','Snack','Mittag','Snack','Abend'],KEY=['b','s','l','s','d'];
const BOOST=[{t:'Magerquark 250 g',k:170,p:30,c:10},{t:'Proteinshake (1 Portion)',k:120,p:24,c:3},{t:'Skyr natur 200 g',k:130,p:22,c:8}];
const sum=a=>a.reduce((o,x)=>({k:o.k+x.k,p:o.p+x.p,c:o.c+x.c}),{k:0,p:0,c:0});
const pant=r=>r.i.length?r.i.filter(x=>has(x.n)).length/r.i.length:0;
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const bad=()=>new RegExp('\\b('+[...S.pork.split(','),...S.excl.split(',')].map(s=>s.trim()).filter(Boolean).join('|')+')s?\\b','i');

function tab(t){document.querySelectorAll('.v').forEach(e=>e.classList.toggle('on',e.id==='v-'+t));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));render()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>tab(b.dataset.t));

async function fetchPool(type,extra,kind){
  const ex=[...S.pork.split(','),...S.excl.split(',')].map(s=>s.trim()).filter(Boolean).join(',');
  const go=async inc=>{
    const q=new URLSearchParams({apiKey:S.key,addRecipeNutrition:true,number:30,sort:'random',type,excludeIngredients:ex,...extra});
    if(inc)q.set('includeIngredients',inc);
    const r=await fetch('https://api.spoonacular.com/recipes/complexSearch?'+q);
    if(r.status===402)throw Error('Das Tageslimit von Spoonacular ist erreicht. Morgen geht es wieder.');
    if(r.status===401||r.status===403)throw Error('Der API-Key ist ungültig. Bitte in den Einstellungen prüfen.');
    if(!r.ok)throw Error('Spoonacular-Fehler '+r.status);
    return (await r.json()).results||[];
  };
  const nu=(r,n)=>(r.nutrition.nutrients.find(x=>x.name===n)||{}).amount||0,rx=bad();
  let res=[];
  if(S.pantry.length){const pick=[...S.pantry].sort(()=>Math.random()-.5).slice(0,2).join(',');try{res=await go(pick)}catch(e){if(/Limit|Key/.test(e.message))throw e}}
  if(res.length<8)res=await go('');
  return res.map(r=>({id:r.id,t:r.title,k:Math.round(nu(r,'Calories')),p:Math.round(nu(r,'Protein')),c:Math.round(nu(r,'Carbohydrates')),m:r.readyInMinutes,u:r.sourceUrl,
    i:(r.extendedIngredients||[]).map(x=>{const m=(x.measures&&x.measures.metric)||{};return{n:(x.name||'').toLowerCase(),a:Math.round((m.amount||0)*10)/10,u:m.unitShort||''}})}))
   .filter(r=>r.i.length&&!r.i.some(x=>rx.test(x.n))&&(kind!=='s'||r.i.length<=7));
}

function boosts(m){
  const t=sum(m),out=[];
  for(const b of BOOST){if(t.p<S.pmin&&out.length<2&&t.k+b.k<=S.kcal&&t.c+b.c<=S.carb){out.push(b);t.p+=b.p;t.k+=b.k;t.c+=b.c}}
  return out;
}
function bestDay(P,used){
  let bs=null,bv=1e9;
  for(let n=0;n<600;n++){
    const m=KEY.map(k=>{const c=P[k].filter(r=>!used.has(r.id));return rnd(c.length?c:P[k])});
    if(m[1].id===m[3].id)continue;
    const t=sum(m);let v=0;
    if(t.p<S.pmin)v+=(S.pmin-t.p)*2;if(t.p>S.pmax)v+=t.p-S.pmax;
    if(t.k>S.kcal)v+=(t.k-S.kcal)*3;if(t.c>S.carb)v+=(t.c-S.carb)*3;
    if(t.k<S.kcal-700)v+=(S.kcal-700-t.k)*.3;
    v-=m.reduce((a,r)=>a+pant(r),0)*12;
    if(v<bv){bv=v;bs=m}
  }
  return bs;
}
async function gen(){
  if(!S.key){tab('set');return}
  const b=$('#gen'),st=$('#st');b.disabled=true;st.textContent='Suche Rezepte …';
  try{
    const veg={diet:'vegetarian'};
    const P={b:await fetchPool('breakfast',{...veg,minProtein:15,maxCalories:600},'b'),
      s:await fetchPool('snack',{...veg,minProtein:8,maxCalories:350,maxReadyTime:15},'s'),
      l:await fetchPool('main course',{minProtein:25,maxCalories:850},'l'),
      d:await fetchPool('main course',{...veg,minProtein:25,maxCalories:850},'d')};
    for(const k in P)if(P[k].length<4)throw Error('Zu wenige passende Rezepte gefunden. Versuche es später noch einmal oder lockere die Ziele.');
    const used=new Set(),days=[];
    for(let i=0;i<3;i++){const m=bestDay(P,used);m.forEach(r=>used.add(r.id));days.push({m,bo:boosts(m)})}
    S.pools=P;S.plan={t:Date.now(),days};save();render();
  }catch(e){st.textContent=e.message;b.disabled=false}
}
function reroll(di,j){
  const d=S.plan.days[di],inPlan=new Set(S.plan.days.flatMap(x=>x.m.map(r=>r.id)));
  const c=(S.pools[KEY[j]]||[]).filter(r=>!inPlan.has(r.id));
  if(!c.length){alert('Keine weiteren Rezepte im Pool. Erstelle einen neuen Plan.');return}
  const cand=Array.from({length:8},()=>rnd(c));
  d.m[j]=cand.sort((a,b)=>pant(b)+Math.random()*.3-pant(a))[0];
  d.bo=boosts(d.m);save();render();
}
function dayHtml(d,i){
  const t=sum([...d.m,...d.bo]),sc=S.pmax*1.15;
  const dt=new Date(S.plan.t+i*864e5).toLocaleDateString('de-CH',{weekday:'long',day:'numeric',month:'long'});
  let h=`<div class="card"><h2>${dt}</h2><div class="pro">${t.p} g <small>Protein (Ziel ${S.pmin}–${S.pmax})</small></div>
  <div class="bar"><i style="width:${Math.min(100,t.p/sc*100)}%"></i><b style="left:${S.pmin/sc*100}%;width:${(S.pmax-S.pmin)/sc*100}%"></b></div>
  <div class="sm mut"><span class="${t.k>S.kcal?'over':''}">${t.k} kcal (max. ${S.kcal})</span> · <span class="${t.c>S.carb?'over':''}">${t.c} g Kohlenhydrate (max. ${S.carb})</span></div>`;
  d.m.forEach((r,j)=>{
    const pc=S.pantry.length?` · ${r.i.filter(x=>has(x.n)).length}/${r.i.length} im Vorrat`:'';
    h+=`<div class="meal"><div><span class="sl">${SL[j]}</span><a href="${esc(r.u)}" target="_blank" rel="noopener">${esc(r.t)}</a>
    <div class="mut sm">${r.k} kcal · ${r.p} g Protein · ${r.c} g KH${r.m?' · '+r.m+' Min.':''}${pc}</div></div>
    <button class="rr" data-d="${i}" data-j="${j}" aria-label="Anderes Rezept wählen">↻</button></div>`});
  d.bo.forEach(b=>{h+=`<div class="meal"><div><span class="sl">Protein-Zusatz</span><b>${esc(b.t)}</b><div class="mut sm">${b.k} kcal · ${b.p} g Protein · ${b.c} g KH (Richtwert)</div></div></div>`});
  return h+'</div>';
}
function rPlan(){
  let h=`<button class="pri" id="gen">${S.plan?'Neuen 3-Tage-Plan erstellen':'3-Tage-Plan erstellen'}</button><p id="st" class="mut sm"></p>`;
  if(!S.plan)h+='<p class="mut">Noch kein Plan. Trage zuerst im Tab «Einstellungen» deinen Spoonacular-API-Key ein.</p>';
  else{
    if(!S.pantry.length)h+='<p class="note">Kein Vorrat hinterlegt. Plan ohne Vorrat erstellt.</p>';
    if(new Date(S.plan.t).toDateString()!==new Date().toDateString())h+='<p class="note">Dieser Plan ist nicht von heute. Erstelle einen neuen für die nächsten 3 Tage.</p>';
    S.plan.days.forEach((d,i)=>h+=dayHtml(d,i));
  }
  const v=$('#v-plan');v.innerHTML=h;$('#gen').onclick=gen;
  v.querySelectorAll('.rr').forEach(b=>b.onclick=()=>reroll(+b.dataset.d,+b.dataset.j));
}
function rPan(){
  const v=$('#v-pan');
  v.innerHTML=`<h2>Was hast du zu Hause?</h2><p class="mut sm">Deutsche Begriffe wie Eier, Quark oder Haferflocken werden übersetzt. Sonst bitte englisch eintragen.</p>
  <div class="row"><input type="text" id="pi" placeholder="Zutat hinzufügen" autocapitalize="none"><button class="pri" id="pa">Hinzufügen</button></div>
  <div>${S.pantry.map((p,i)=>`<span class="chip">${esc(p)}<button data-i="${i}" aria-label="${esc(p)} entfernen">×</button></span>`).join('')||'<p class="mut">Noch leer.</p>'}</div>`;
  const add=()=>{const w=en($('#pi').value);if(w&&!S.pantry.includes(w)){S.pantry.push(w);save()}rPan()};
  $('#pa').onclick=add;$('#pi').onkeydown=e=>{if(e.key==='Enter')add()};
  v.querySelectorAll('.chip button').forEach(b=>b.onclick=()=>{S.pantry.splice(+b.dataset.i,1);save();rPan()});
}
function rShop(){
  const m={};
  (S.plan?S.plan.days:[]).forEach(d=>d.m.forEach(r=>r.i.forEach(x=>{if(!x.n||SKIP.test(x.n)||has(x.n))return;const e=m[x.n]=m[x.n]||{};e[x.u]=(e[x.u]||0)+x.a})));
  const names=Object.keys(m).sort();
  let h='<h2>Einkaufsliste für die 3 Tage</h2>';
  if(!S.plan)h+='<p class="mut">Erstelle zuerst einen Plan.</p>';
  else if(!names.length)h+='<p class="mut">Alles da. Nichts einzukaufen.</p>';
  h+=names.map(n=>{const q=Object.entries(m[n]).map(([u,a])=>`${Math.round(a*10)/10}${u?' '+u:''}`).join(' + '),c=S.checked[n];
    return `<label class="it${c?' d':''}"><input type="checkbox" data-n="${esc(n)}" ${c?'checked':''}><span>${esc(n)} <span class="mut sm">${esc(q)}</span></span></label>`}).join('');
  if(names.length)h+='<p><button class="pri" id="done">Einkauf erledigt: Abgehakte in den Vorrat</button></p>';
  const v=$('#v-shop');v.innerHTML=h;
  v.querySelectorAll('input').forEach(i=>i.onchange=()=>{S.checked[i.dataset.n]=i.checked;save();rShop()});
  const d=$('#done');if(d)d.onclick=()=>{Object.keys(S.checked).filter(n=>S.checked[n]).forEach(n=>{if(!S.pantry.includes(n))S.pantry.push(n)});S.checked={};save();rShop()};
}
function rSet(){
  const f=(k,l,t='number')=>`<label class="f" for="s-${k}">${l}</label><input id="s-${k}" data-k="${k}" type="${t}" value="${esc(S[k])}" autocapitalize="none" autocomplete="off">`;
  $('#v-set').innerHTML=`<h2>Einstellungen</h2><p class="mut sm">Alles wird nur auf diesem Gerät gespeichert.</p>
  ${f('key','Spoonacular API-Key','password')}${f('kcal','Max. Kalorien pro Tag')}${f('carb','Max. Kohlenhydrate pro Tag (g)')}${f('pmin','Protein mindestens (g)')}${f('pmax','Protein höchstens (g)')}
  ${f('excl','Ausgeschlossene Zutaten (englisch, Komma)','text')}${f('pork','Fleischsorten ausgeschlossen (englisch, Komma)','text')}
  <p class="mut sm">Vegetarisch gilt für Frühstück, Snacks und Abendessen. Das Mittagessen darf Fleisch oder Fisch enthalten.</p>`;
  document.querySelectorAll('#v-set input').forEach(i=>i.oninput=()=>{S[i.dataset.k]=i.type==='number'?(+i.value||0):i.value.trim();save()});
}
function render(){rPlan();rPan();rShop();rSet()}
render();
</script></body></html>
