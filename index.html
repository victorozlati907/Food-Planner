<!DOCTYPE html>
<html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Essensplan">
<meta name="theme-color" content="#EEF2EC">
<title>Essensplan</title>
<style>
:root{--bg:#EEF2EC;--ink:#1D2B22;--mut:#5E6F64;--card:#fff;--ac:#0F6B5C;--p:#B8740F;--bad:#B3402F;--line:#D5DDD3}
@media(prefers-color-scheme:dark){:root{--bg:#141C17;--ink:#E6EEE8;--mut:#93A59A;--card:#1E2822;--ac:#4DBBA5;--p:#E0A84A;--bad:#E27D6C;--line:#2E3B33}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 "Avenir Next",ui-rounded,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(70px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:12px 16px}
.v{display:none}.v.on{display:block}
h2{font-size:15px;margin:0 0 4px;font-weight:600}
.mut{color:var(--mut)}.sm{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.pro{font-size:40px;font-weight:700;line-height:1;color:var(--p)}
.pro small{font-size:15px;font-weight:500;color:var(--mut)}
.bar{position:relative;height:10px;border-radius:5px;background:var(--line);margin:10px 0 6px;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;left:0;background:var(--p)}
.bar b{position:absolute;top:0;bottom:0;border-left:2px solid var(--ink);border-right:2px solid var(--ink);opacity:.45}
.meal{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.meal>div{min-width:0}
.sl{display:block;font-size:13px;color:var(--mut)}
summary{font-weight:600;cursor:pointer;padding:2px 0}
details p{margin:6px 0}
button{font:inherit;color:inherit}
.rr{min-width:44px;min-height:44px;border:1px solid var(--line);background:none;border-radius:10px;font-size:18px}
.pri{width:100%;min-height:48px;border:0;border-radius:12px;background:var(--ac);color:var(--bg);font-weight:600}
.pri:disabled{opacity:.5}
.over{color:var(--bad);font-weight:600}
.note{background:var(--card);border-left:4px solid var(--p);padding:8px 12px;border-radius:6px;font-size:14px}
input[type=text],input[type=password],input[type=number]{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
label.f{display:block;margin:12px 0 4px;font-size:14px;color:var(--mut)}
.row{display:flex;gap:8px}.row button{min-width:90px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 6px 6px 12px;margin:4px 4px 0 0}
.chip button{border:0;background:none;min-width:32px;min-height:32px;font-size:18px}
.it{display:flex;gap:12px;align-items:center;min-height:48px;border-bottom:1px solid var(--line)}
.it input{width:22px;height:22px;accent-color:var(--ac)}
.it.d{opacity:.5;text-decoration:line-through}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-height:56px;border:0;background:none;color:var(--mut);font-size:13px}
nav button.on{color:var(--ac);font-weight:700}
a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style></head><body><main>
<div id="v-plan" class="v on"></div><div id="v-pan" class="v"></div><div id="v-shop" class="v"></div><div id="v-set" class="v"></div>
</main>
<nav><button data-t="plan" class="on">Plan</button><button data-t="pan">Vorrat</button><button data-t="shop">Einkauf</button><button data-t="set">Einstellungen</button></nav>
<script>
const $=s=>document.querySelector(s),K='essensplan.v2',K1='essensplan.v1';
const def={kcal:2500,kmin:2200,carb:300,pmin:150,pmax:180,fav:'',excl:'onion,garlic',pantry:[],plan:null,checked:{}};
let S;
try{
  const raw=localStorage.getItem(K);
  if(raw)S={...def,...JSON.parse(raw)};
  else{S={...def};const o=JSON.parse(localStorage.getItem(K1)||'null');if(o&&Array.isArray(o.pantry))S.pantry=o.pantry}
}catch(e){S={...def}}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DE={eier:'egg',ei:'egg',milch:'milk',quark:'cottage cheese',magerquark:'cottage cheese',skyr:'yogurt',joghurt:'yogurt',haferflocken:'oats',reis:'rice',kartoffeln:'potato',tomaten:'tomato',spinat:'spinach',linsen:'lentil',kichererbsen:'chickpea',tofu:'tofu',käse:'cheese',hähnchen:'chicken',lachs:'salmon',thunfisch:'tuna',brokkoli:'broccoli',paprika:'bell pepper',karotten:'carrot',zucchini:'zucchini',avocado:'avocado',nüsse:'nuts',butter:'butter',olivenöl:'olive oil',feta:'feta',mozzarella:'mozzarella',bohnen:'beans',nudeln:'pasta',gurke:'cucumber',pilze:'mushroom',champignons:'mushroom',blumenkohl:'cauliflower',erdnussbutter:'peanut butter',mandeln:'almond',banane:'banana',quinoa:'quinoa',hafer:'oats'};
const en=w=>{w=w.trim().toLowerCase();return DE[w]||w};
const has=n=>S.pantry.some(p=>n.includes(p)||(n.length>=3&&p.includes(n)));
const SKIP=/^(salt|water|pepper|black pepper|ice|ice cubes|sea salt|kosher salt|cooking spray|nonstick cooking spray)$/;
const SL=['Frühstück','Snack','Mittagessen','Snack','Abendessen'],KEY=['b','s','l','s','d'];
const NAME={b:'das Frühstück',s:'die Snacks',l:'das Mittagessen',d:'das Abendessen'};
const OPT=[[.75,1,1.25,1.5,2],[1,1.5,2],[.75,1,1.25,1.5,2],[1,1.5,2],[.75,1,1.25,1.5,2]];
const BOOST=[{t:'Magerquark 250 g',k:170,p:30,c:10},{t:'Proteinshake (1 Portion)',k:120,p:24,c:3},{t:'Skyr natur 200 g',k:130,p:22,c:8}];
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const fx=v=>String(v).replace('.',',');
const favs=()=>S.fav.split(',').map(en).filter(Boolean);
const pant=r=>r.i.length?r.i.filter(x=>has(x)).length/r.i.length:0;
const favHit=(r,fl)=>fl.length?Math.min(2,r.i.filter(x=>fl.some(f=>x.includes(f))).length):0;

/* ---------- Rezeptdatei laden ---------- */
let DB=null,DBERR='';
function parseCSV(t){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===','){row.push(f);f=''}
    else if(c==='\n'){row.push(f);rows.push(row);row=[];f=''}
    else if(c!=='\r')f+=c;
  }
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows;
}
async function loadDB(){
  try{
    const r=await fetch('rezepte.csv');
    if(!r.ok)throw 0;
    const rows=parseCSV(await r.text()),h=rows.shift(),ix=n=>h.indexOf(n);
    DB=rows.filter(x=>x.length>=h.length).map(x=>({id:x[ix('id')],t:x[ix('name')],m:+x[ix('minutes')],k:+x[ix('kcal')],p:+x[ix('protein')],c:+x[ix('carbs')],sl:x[ix('slots')],i:x[ix('ingredients')].split('|').filter(Boolean),s:x[ix('steps')]}));
    if(!DB.length)throw 0;
  }catch(e){DB=null;DBERR='Die Rezeptdatei rezepte.csv wurde nicht gefunden. Sie muss im selben Ordner wie index.html liegen.'}
  render();
}

/* ---------- Planung ---------- */
const tot=(m,fs)=>m.reduce((o,r,j)=>({k:o.k+r.k*fs[j],p:o.p+r.p*fs[j],c:o.c+r.c*fs[j]}),{k:0,p:0,c:0});
const pen=t=>(t.p<S.pmin?(S.pmin-t.p)*3:0)+(t.p>S.pmax?t.p-S.pmax:0)+(t.k>S.kcal?(t.k-S.kcal)*4:0)+(t.k<S.kmin?S.kmin-t.k:0)+(t.c>S.carb?(t.c-S.carb)*4:0);
function fit(m){
  const fs=m.map(()=>1);
  for(let a=0;a<3;a++)for(let j=0;j<m.length;j++){
    let bo=fs[j],bv=1e12;
    for(const o of OPT[j]){const g=[...fs];g[j]=o;const v=pen(tot(m,g));if(v<bv-1e-9){bv=v;bo=o}}
    fs[j]=bo;
  }
  return fs;
}
const score=(m,fs,fl)=>pen(tot(m,fs))-m.reduce((a,r)=>a+pant(r)*12+favHit(r,fl)*10,0);
const pick=(c,fl)=>{let b=null,bs=-1;for(let t=0;t<3;t++){const r=rnd(c),s=pant(r)+favHit(r,fl)*.3+Math.random()*.2;if(s>bs){bs=s;b=r}}return b};
function pools(){
  const ex=S.excl.split(',').map(en).filter(Boolean);
  const rx=ex.length?new RegExp(ex.map(e=>e.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'i'):null;
  const ok=DB.filter(r=>!rx||!r.i.some(x=>rx.test(x)));
  const P={};['b','s','l','d'].forEach(k=>P[k]=ok.filter(r=>r.sl.includes(k)));
  return P;
}
function bestDay(P,used,fl){
  const av={};['b','s','l','d'].forEach(k=>{const c=P[k].filter(r=>!used.has(r.id));av[k]=c.length>=3?c:P[k]});
  let bs=null,bv=1e12;
  for(let n=0;n<500;n++){
    const m=KEY.map(k=>pick(av[k],fl));
    if(new Set(m.map(r=>r.id)).size<5)continue;
    const fs=fit(m),v=score(m,fs,fl);
    if(v<bv){bv=v;bs={m,fs}}
  }
  if(!bs){const m=KEY.map(k=>rnd(av[k]));bs={m,fs:fit(m)}}
  return bs;
}
function boosts(m,fs){
  const t=tot(m,fs),out=[];
  for(const b of BOOST){if(t.p<S.pmin&&out.length<2&&t.k+b.k<=S.kcal&&t.c+b.c<=S.carb){out.push(b);t.p+=b.p;t.k+=b.k;t.c+=b.c}}
  return out;
}
function gen(){
  if(!DB)return;
  const P=pools(),st=$('#st');
  for(const k in P)if(P[k].length<3){st.textContent='Zu wenige Rezepte für '+NAME[k]+' ('+P[k].length+'). Prüfe die ausgeschlossenen Zutaten in den Einstellungen oder die Rezeptdatei.';return}
  const fl=favs(),used=new Set(),days=[];
  for(let i=0;i<3;i++){const {m,fs}=bestDay(P,used,fl);m.forEach(r=>used.add(r.id));days.push({m,f:fs,bo:boosts(m,fs)})}
  S.plan={t:Date.now(),days};save();render();
}
function reroll(di,j){
  const d=S.plan.days[di],P=pools(),fl=favs(),inPlan=new Set(S.plan.days.flatMap(x=>x.m.map(r=>r.id)));
  const c=P[KEY[j]].filter(r=>!inPlan.has(r.id));
  if(!c.length){alert('Keine weiteren Rezepte verfügbar.');return}
  let best=null,bv=1e12;
  for(let n=0;n<8;n++){
    const m=[...d.m];m[j]=pick(c,fl);
    const fs=fit(m),v=score(m,fs,fl);
    if(v<bv){bv=v;best={m,fs}}
  }
  d.m=best.m;d.f=best.fs;d.bo=boosts(d.m,d.f);save();render();
}

/* ---------- Anzeige ---------- */
function dayHtml(d,i){
  const t=tot(d.m,d.f),bt=d.bo.reduce((o,b)=>({k:o.k+b.k,p:o.p+b.p,c:o.c+b.c}),{k:0,p:0,c:0});
  const K_=Math.round(t.k+bt.k),P_=Math.round(t.p+bt.p),C_=Math.round(t.c+bt.c),sc=S.pmax*1.15;
  const dt=new Date(S.plan.t+i*864e5).toLocaleDateString('de-CH',{weekday:'long',day:'numeric',month:'long'});
  let h=`<div class="card"><h2>${dt}</h2><div class="pro">${P_} g <small>Protein (Ziel ${S.pmin}–${S.pmax})</small></div>
  <div class="bar"><i style="width:${Math.min(100,P_/sc*100)}%"></i><b style="left:${S.pmin/sc*100}%;width:${(S.pmax-S.pmin)/sc*100}%"></b></div>
  <div class="sm mut"><span class="${K_>S.kcal?'over':''}">${K_} kcal (max. ${S.kcal})</span> · <span class="${C_>S.carb?'over':''}">${C_} g Kohlenhydrate (max. ${S.carb})</span></div>`;
  d.m.forEach((r,j)=>{
    const f=d.f[j],pc=S.pantry.length?` · ${r.i.filter(x=>has(x)).length}/${r.i.length} im Vorrat`:'';
    h+=`<div class="meal"><div><span class="sl">${SL[j]} · ${fx(f)} ${f===1?'Portion':'Portionen'}</span>
    <details><summary>${esc(r.t)}</summary><p class="sm"><b>Zutaten:</b> ${esc(r.i.join(', '))}</p><p class="sm">${esc(r.s)}</p><p class="sm mut">Angaben pro Portion des Originalrezepts: ${r.k} kcal, ${r.p} g Protein, ${r.c} g KH.</p></details>
    <div class="mut sm">${Math.round(r.k*f)} kcal · ${Math.round(r.p*f)} g Protein · ${Math.round(r.c*f)} g KH${r.m?' · '+r.m+' Min.':''}${pc}</div></div>
    <button class="rr" data-d="${i}" data-j="${j}" aria-label="Anderes Rezept wählen">↻</button></div>`});
  d.bo.forEach(b=>{h+=`<div class="meal"><div><span class="sl">Protein-Zusatz</span><b>${esc(b.t)}</b><div class="mut sm">${b.k} kcal · ${b.p} g Protein · ${b.c} g KH (Richtwert)</div></div></div>`});
  return h+'</div>';
}
function rPlan(){
  const v=$('#v-plan');
  if(!DB){v.innerHTML=DBERR?`<p class="note">${esc(DBERR)}</p>`:'<p class="mut">Lade Rezepte …</p>';return}
  let h=`<button class="pri" id="gen">${S.plan?'Neuen 3-Tage-Plan erstellen':'3-Tage-Plan erstellen'}</button><p id="st" class="mut sm"></p>`;
  if(S.plan&&S.plan.days&&S.plan.days[0]&&S.plan.days[0].f){
    if(!S.pantry.length)h+='<p class="note">Kein Vorrat hinterlegt. Plan ohne Vorrat erstellt.</p>';
    if(new Date(S.plan.t).toDateString()!==new Date().toDateString())h+='<p class="note">Dieser Plan ist nicht von heute. Erstelle einen neuen für die nächsten 3 Tage.</p>';
    S.plan.days.forEach((d,i)=>h+=dayHtml(d,i));
    h+='<p class="mut sm">Die Portionen sind so skaliert, dass die Tagesziele erreicht werden. Nährwerte stammen aus dem Datensatz und sind Näherungen.</p>';
  }else h+='<p class="mut">Noch kein Plan.</p>';
  v.innerHTML=h;$('#gen').onclick=gen;
  v.querySelectorAll('.rr').forEach(b=>b.onclick=()=>reroll(+b.dataset.d,+b.dataset.j));
}
function rPan(){
  const v=$('#v-pan');
  v.innerHTML=`<h2>Was hast du zu Hause?</h2><p class="mut sm">Deutsche Begriffe wie Eier, Quark oder Haferflocken werden übersetzt. Sonst bitte englisch eintragen. Rezepte mit Zutaten aus dem Vorrat werden bevorzugt.</p>
  <div class="row"><input type="text" id="pi" placeholder="Zutat hinzufügen" autocapitalize="none"><button class="pri" id="pa">Hinzufügen</button></div>
  <div>${S.pantry.map((p,i)=>`<span class="chip">${esc(p)}<button data-i="${i}" aria-label="${esc(p)} entfernen">×</button></span>`).join('')||'<p class="mut">Noch leer.</p>'}</div>`;
  const add=()=>{const w=en($('#pi').value);if(w&&!S.pantry.includes(w)){S.pantry.push(w);save()}rPan()};
  $('#pa').onclick=add;$('#pi').onkeydown=e=>{if(e.key==='Enter')add()};
  v.querySelectorAll('.chip button').forEach(b=>b.onclick=()=>{S.pantry.splice(+b.dataset.i,1);save();rPan()});
}
function rShop(){
  const m={},bo={};
  const ok=S.plan&&S.plan.days&&S.plan.days[0]&&S.plan.days[0].f;
  (ok?S.plan.days:[]).forEach(d=>{
    d.m.forEach(r=>r.i.forEach(x=>{if(!x||SKIP.test(x)||has(x))return;m[x]=(m[x]||0)+1}));
    d.bo.forEach(b=>bo[b.t]=(bo[b.t]||0)+1);
  });
  const names=Object.keys(m).sort(),bn=Object.keys(bo);
  let h='<h2>Einkaufsliste für die 3 Tage</h2><p class="mut sm">Der Datensatz enthält keine Mengen. Die Zahl zeigt, in wie vielen Gerichten die Zutat vorkommt.</p>';
  if(!ok)h+='<p class="mut">Erstelle zuerst einen Plan.</p>';
  else if(!names.length&&!bn.length)h+='<p class="mut">Alles da. Nichts einzukaufen.</p>';
  h+=names.map(n=>{const c=S.checked[n];
    return `<label class="it${c?' d':''}"><input type="checkbox" data-n="${esc(n)}" ${c?'checked':''}><span>${esc(n)} <span class="mut sm">${m[n]}×</span></span></label>`}).join('');
  if(bn.length)h+='<h2 style="margin-top:16px">Protein-Zusatz</h2>'+bn.map(n=>`<div class="it"><span>${esc(n)} <span class="mut sm">${bo[n]}×</span></span></div>`).join('');
  if(names.length)h+='<p><button class="pri" id="done">Einkauf erledigt: Abgehakte in den Vorrat</button></p>';
  const v=$('#v-shop');v.innerHTML=h;
  v.querySelectorAll('input').forEach(i=>i.onchange=()=>{S.checked[i.dataset.n]=i.checked;save();rShop()});
  const d=$('#done');if(d)d.onclick=()=>{Object.keys(S.checked).filter(n=>S.checked[n]).forEach(n=>{if(!S.pantry.includes(n))S.pantry.push(n)});S.checked={};save();rShop()};
}
function rSet(){
  const f=(k,l,t='number')=>`<label class="f" for="s-${k}">${l}</label><input id="s-${k}" data-k="${k}" type="${t}" value="${esc(S[k])}" autocapitalize="none" autocomplete="off">`;
  $('#v-set').innerHTML=`<h2>Einstellungen</h2><p class="mut sm">Alles wird nur auf diesem Gerät gespeichert. ${DB?DB.length+' Rezepte geladen.':''}</p>
  ${f('kcal','Max. Kalorien pro Tag')}${f('kmin','Mindestens anstreben (kcal)')}${f('carb','Max. Kohlenhydrate pro Tag (g)')}${f('pmin','Protein mindestens (g)')}${f('pmax','Protein höchstens (g)')}
  ${f('fav','Lieblingszutaten, werden bevorzugt (Komma getrennt)','text')}${f('excl','Ausgeschlossene Zutaten (Komma getrennt)','text')}
  <p class="mut sm">Die Rezeptdatei enthält bereits nur Gerichte ohne Zwiebeln, Knoblauch und Schweinefleisch. Frühstück, Snacks und Abendessen sind vegetarisch, das Mittagessen darf Fleisch oder Fisch enthalten. Neue Eingaben gelten für den nächsten Plan.</p>`;
  document.querySelectorAll('#v-set input').forEach(i=>i.oninput=()=>{S[i.dataset.k]=i.type==='number'?(+i.value||0):i.value.trim();save()});
}
function render(){rPlan();rPan();rShop();rSet()}
function tab(t){document.querySelectorAll('.v').forEach(e=>e.classList.toggle('on',e.id==='v-'+t));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));render()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>tab(b.dataset.t));
render();loadDB();
</script></body></html>
